name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-tools:
    name: Host tooling
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run host tests
        run: python -m unittest discover -s tests -v

  firmware-evidence:
    name: Zephyr qemu_cortex_m3 firmware evidence
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: assureloop

      - name: Setup Zephyr project
        uses: zephyrproject-rtos/action-zephyr-setup@v1
        with:
          app-path: assureloop
          toolchains: arm-zephyr-eabi

      - name: Build firmware
        working-directory: assureloop
        run: west build -p always -b qemu_cortex_m3 firmware/app

      - name: Generate firmware evidence bundle with SBOM
        working-directory: assureloop
        run: bash scripts/firmware-evidence-demo.sh --generate-sbom

      - name: Validate firmware release manifest
        working-directory: assureloop
        run: python tools/validate_manifest.py --manifest dist/firmware-release/release-manifest.json

      - name: Verify firmware release manifest
        working-directory: assureloop
        run: python tools/verify_release.py --manifest dist/firmware-release/release-manifest.json --base-dir .

      - name: Verify firmware evidence bundle
        working-directory: assureloop
        run: |
          bash scripts/verify-firmware-evidence.sh --bundle dist/firmware-release/evidence-bundle
          python tools/verify_evidence_bundle.py --bundle dist/firmware-release/evidence-bundle.tar.gz

      - name: Create and verify simulator update package
        working-directory: assureloop
        run: bash scripts/update-package-demo.sh

      - name: Check firmware evidence outputs
        working-directory: assureloop
        run: |
          test -f dist/firmware-release/release-manifest.json
          test -f dist/firmware-release/trace-report.json
          test -d dist/firmware-release/evidence-bundle
          test -f dist/firmware-release/evidence-bundle.tar.gz
          test -d dist/firmware-release/evidence-bundle/sbom
          test -f dist/firmware-release/update-package/update-package.json
          test -f dist/firmware-release/update-package/evidence-bundle.tar.gz

      - name: Upload firmware evidence bundle
        uses: actions/upload-artifact@v4
        with:
          name: assureloop-firmware-evidence-qemu-cortex-m3
          path: |
            assureloop/dist/firmware-release/release-manifest.json
            assureloop/dist/firmware-release/trace-report.json
            assureloop/dist/firmware-release/evidence-bundle/**
            assureloop/dist/firmware-release/evidence-bundle.tar.gz
            assureloop/dist/firmware-release/update-package/**
          if-no-files-found: error
